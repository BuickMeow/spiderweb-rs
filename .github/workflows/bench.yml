name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  bench:
    name: core micro-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev pkg-config
      - name: Run benchmarks
        run: cargo bench -p spiderweb-core --bench engine -- --output-format bencher | tee output.txt
      - name: Ensure the gh-pages branch exists
        if: github.event_name == 'push'
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add --detach ../gh-pages-init
            cd ../gh-pages-init
            git checkout --orphan gh-pages
            git rm -rf --quiet .
            printf '<!doctype html><meta charset="utf-8"><title>Spiderweb benchmarks</title>\n' > index.html
            git add index.html
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "init gh-pages"
            git push origin gh-pages
          fi
      - name: Does gh-pages exist?
        id: ghpages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Store benchmark result (gh-pages + PR comment)
        if: steps.ghpages.outputs.exists == '1'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # PRs only compare and comment; main records data points
          auto-push: ${{ github.event_name == 'push' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          alert-threshold: '130%'
          fail-on-alert: false
