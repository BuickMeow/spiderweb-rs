name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: Spiderweb-windows-x64.zip
          - os: macos-latest
            package: Spiderweb-macos.zip
          - os: ubuntu-latest
            package: Spiderweb-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev pkg-config
      - name: Build
        run: cargo build --release -p spiderweb-app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/spiderweb-app.exe dist/Spiderweb.exe
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}"

      - name: Package (macOS, .app bundle)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Spiderweb.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/spiderweb-app "$APP/Contents/MacOS/Spiderweb"
          # Bundle icon: sips makes the sizes, iconutil the .icns
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z "$s" "$s" assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/Spiderweb.icns"
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Spiderweb</string>
            <key>CFBundleDisplayName</key><string>Spiderweb</string>
            <key>CFBundleIdentifier</key><string>io.github.buickmeow.spiderweb</string>
            <key>CFBundleExecutable</key><string>Spiderweb</string>
            <key>CFBundleIconFile</key><string>Spiderweb.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no developer certificate): lets the bundle launch
          codesign --force --deep --sign - "$APP"
          cp LICENSE README.md dist/
          ditto -c -k --keepParent "$APP" "${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/spiderweb-app dist/Spiderweb
          cp LICENSE README.md dist/
          tar -czf "${{ matrix.package }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package }}
          generate_release_notes: true
