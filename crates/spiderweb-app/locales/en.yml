    ends_stretch: "Stretch gates"
    ends_tip: "What happens to the bit of each key that doesn't fit a whole gate.\nPictures of each: Help (F1) → Inside fill."
    start: "start"
    auto: "Auto"
    auto_tip: "Each key's notes start at that key's left edge,\nso the left side is exact and the right side ragged."
    aligned: "Aligned"
    aligned_tip: "Every note sits on the gate grid counted from the start of the song,\nso the notes form straight columns (lined up with bar lines and\nother shapes); both sides are a little ragged."
    centred: "Centred"
    centred_tip: "What doesn't fit a whole gate is shared between both ends of each key,\nso a peak or a point comes out the same on both sides."
    overlaps_cancel_out: "Overlaps cancel out"
    fill_and_spam_where_outlines_overlap: "Fill and Spam: where outlines overlap, the overlap is left empty\n(a shape inside a shape makes a hole). Off: inside any outline is filled,\noverlaps and holes too."
    normal_outline: "Normal / Outline"
    normal: "Normal"
    outline: "Outline"
    normal_all_its_notes_together_outline: "Normal: all its notes together.\nOutline: the notes along the edge of what's filled go on a channel of their own\nand the inside's on another (the same gate, so they line up). Needs Channels: Multi channel."
    info_pasted: "%{total} pasted notes. "
    info_pasted_drag: "Drag a corner or side to stretch them, just outside a corner to turn them, just outside a side's middle to skew them."
    info_notes: "%{total} notes."
    info_one_gap: "The outline has a gap: it's filled as if a straight line closed it (the dashed line)."
    info_gaps: "The outline has %{gaps} gaps: each is closed with a straight line (the dashed lines)."
    ends_that_nearly_touch_1_64: "\nEnds that nearly touch (1/64 beat, 1 key) are joined; open parts that are almost\nstraight aren't filled. Close the gaps yourself to decide where the edge goes."
    info_picked: "Picked: stroke %{k} of %{n} (Del = delete it, Ctrl+C / H / J / arrows = copy, flip, turn it, Esc = unpick). Select tool: click a stroke of the selected shape to pick it."
    they_keep_their_own_velocities: "They keep their own velocities until you change the velocity here or in the velocity pane. "
    info_live: "Live shape: what you draw goes into one custom shape (a new one now). Close its outline (points snap onto its ends) to fill it."
    info_pick: "Pick a shape, or make one with Drawer…"
    info_drag_perfect: "Drag a box on the piano roll, or click two corners (Ctrl = a perfect %{tool} on screen)."
