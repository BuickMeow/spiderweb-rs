    domino_start_tip: "Where copied and pasted notes start:\nFirst note at tick 0: the first note lands right on the cursor / play line.\nFrom the bar line: the empty space from the bar line before the first note\ncomes along, so the notes keep their place in the bar."
    paste_domino: "Paste from Domino"
    copy_domino: "Copy to Domino"
    channels: "Channels"
    mode_raw: "As drawn"
    mode_raw_tip: "Keeps overlaps.\nEvery note exactly as the shapes make it, all on one channel.\nNotes on the same key can overlap or start on the same tick."
    mode_single: "Single channel"
    mode_single_tip: "Removes overlaps, all on one channel.\nWhere two notes on the same key overlap, the earlier one is cut\nwhere the later one starts, and the later one is stretched\nto where the earlier one would have ended.\nNotes starting on the same tick become one note: the loudest wins,\nand it's as long as the longest of them."
    mode_auto: "Multi channel"
    mode_auto_tip: "A channel per overlap.\nShapes whose notes overlap go on different channels, each on its own\ntrack (channel 10 is skipped). Shapes that don't clash share a channel.\nThe box below picks what counts as an overlap."
    split: "Split"
    split_key: "Split: same key at the same time"
    split_time: "Split: any notes at the same time"
    split_tip: "Same key: shapes only get split when they play the same key at the same time.\nAny notes: shapes get split whenever their notes play at the same time,\neven on different keys (e.g. two parallel lines, or lines starting on the\nsame tick). Shapes that follow one after another still share a channel."
